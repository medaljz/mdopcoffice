<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OPC</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header class="topbar"><a class="brand" href="/" aria-label="OPC 首页"><span class="brand-mark"><i></i><i></i><i></i><i></i></span><b>OPC<span>一人公司</span></b></a><div class="top-meta"><span class="connection-dot"></span><span id="connection">正在连接办公室…</span></div><div class="mode-switch" aria-label="运行模式"><button data-mode="live" class="selected">真实工作</button><button data-mode="demo">体验演示</button></div><button id="quiet" class="icon-button" title="暂停装饰动画" aria-label="暂停装饰动画">◴</button><button type="button" class="owner-avatar" aria-label="董事长人物档案" title="董事长人物档案">我</button></header>
<div class="app-shell"><nav class="rail" aria-label="主导航"><button data-tab="office" class="active" title="办公室"><span><svg viewBox="0 0 24 24" width="23" height="23" aria-hidden="true"><path d="M3 3H21V21H3ZM7 7V9H9V7ZM13 7V9H17V7ZM7 13V17H9V13ZM13 13V17H17V13Z" fill="currentColor" fill-rule="evenodd"/></svg></span>办公室</button><button data-tab="people" title="员工与技能"><span><svg viewBox="0 0 24 24" width="23" height="23" aria-hidden="true"><path d="M8 2H16V5H19V12H16V15H20V22H4V15H8V12H5V5H8ZM9 6V11H15V6Z" fill="currentColor" fill-rule="evenodd"/></svg></span>员工</button><button data-tab="projects" title="项目记录"><span><svg viewBox="0 0 24 24" width="23" height="23" aria-hidden="true"><path d="M3 3H11V6H21V21H3ZM6 10V12H18V10ZM6 15V17H15V15Z" fill="currentColor" fill-rule="evenodd"/></svg></span>项目</button><button data-tab="finance" title="财务账本"><span><svg viewBox="0 0 24 24" width="23" height="23" aria-hidden="true"><path d="M3 5H21V20H3ZM6 9V16H8V9ZM11 12V16H13V12ZM16 8V16H18V8Z" fill="currentColor" fill-rule="evenodd"/></svg></span>财务</button><div class="rail-bottom"><button data-tab="settings" title="连接设置"><span><svg viewBox="0 0 24 24" width="23" height="23" aria-hidden="true"><path d="M8 2H16V5H20V9H23V16H20V20H16V23H8V20H4V16H1V9H4V5H8ZM8 9V16H16V9Z" fill="currentColor" fill-rule="evenodd"/></svg></span>连接</button><span>LOCAL<br>v0.1</span></div></nav>
<main><div class="page-heading"><div><div class="eyebrow">YOUR LITTLE COMPANY, BIG POSSIBILITIES</div><h1>今天，也一起把想法变成现实<span class="heading-dot">.</span></h1><p>你负责好点子，伙伴们负责各显身手。</p></div><button class="primary" id="assign">＋ 安排新任务</button></div>
<div id="notice" class="notice" hidden></div>
<section class="project-summary" aria-label="项目进度"><div class="project-symbol">▧</div><div class="project-main"><div class="summary-label">当前项目 <span id="project-state" class="tag">待命</span></div><h2 id="project-title">办公室已就绪，等你的第一个想法</h2><div class="progress-line"><div class="progress-track"><div id="progress-fill"></div></div><b id="progress-number">—</b></div></div><div class="project-detail"><span>当前阶段</span><strong id="current-stage">等待老板安排</strong></div><div class="project-detail eta"><span>预计剩余</span><strong id="eta">—</strong></div></section>
<div class="workspace"><section class="office-panel"><div class="panel-top"><div><span class="live-dot"></span><b>我的办公室</b><span id="office-count" class="muted">8 位伙伴</span></div><span class="map-hint">点击人物，查看身份和任务</span><button id="zoom" class="small-button" title="放大办公室">⛶</button></div><div id="office" class="office-scene"></div><div class="office-legend"><span><i class="green"></i>工作中</span><span><i class="sand"></i>空闲 / 休息</span><span><i class="red"></i>需要关注</span><span class="legend-right">点击人物互动 · 状态随任务同步</span></div></section>
<aside class="inspector"><div class="inspector-heading"><b id="inspector-title">主管办公室</b><span>↗</span></div><div id="inspector-content"></div></aside></div>
<section class="activity-panel"><div class="activity-heading"><b>公司动态</b><span class="muted">每一步，都有迹可循</span><span id="sync-time" class="sync-time"></span></div><div id="activity-list"></div></section>
<footer>一台电脑，一个想法，一家公司。<span>OPC · 本地运行</span></footer>
</main></div>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close-dialog" class="icon-button" aria-label="关闭">×</button></div><div id="dialog-body"></div></dialog><div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/app.js"></script>
</body></html>
